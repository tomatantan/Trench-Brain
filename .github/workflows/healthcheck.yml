name: healthcheck

# Trench-Brain 自己修復番犬（Priority 0・2026-08-06 本人指示「作りまくれ」で新設）。
# 目的: 収集(collect-cloud)は生きてても「合成」を回す人間(Mac/Windows)がいなくなった時、
# 誰にも気づかれず brain/state/health.jsonl が止まったまま放置される事故を二度と起こさない。
# ★2026-08-06 実例: Windows cron が死んで(過去commitで自己申告あり)から3週間超、
#   誰にも通知が飛ばず無検知で放置されていたのを本人指示で発見・修復。この番犬はその再発防止。
# 設計原則: $0・API/サブスク非依存(GHA標準pythonのみ、LLM不使用)。
#   「合成を自動で直す」のはこのjobの仕事ではない(LLM合成はローカルsubscription専任=指針は
#   COORDINATION.md/CLAUDE.mdの書き込みパス分離と同じ)。この番犬の仕事は「検知したら必ず言う」
#   ＝沈黙しない事。直すのは人間 or ローカルセッションでの brain/pipeline.py 実行 or selfheal skill。

on:
  schedule:
    - cron: "0 */6 * * *"  # 6時間毎チェック。通常の合成サイクルは3〜4h毎なので十分な余裕を見て閾値は18h。
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check synthesis freshness + collection health
        id: check
        run: |
          python3 - <<'PYEOF' >> "$GITHUB_OUTPUT"
          import json
          from datetime import datetime, timezone

          SYNTH_THRESHOLD_HOURS = 18  # 通常3-4h毎更新。これを超えたら異常とみなす。

          def emit(k, v):
              print(f"{k}={v}")

          problems = []

          # --- 1. 合成の鮮度(health.jsonl) ---
          try:
              with open("brain/state/health.jsonl") as f:
                  lines = [l for l in f if l.strip()]
              last = json.loads(lines[-1])
              last_ts = datetime.strptime(last["ts"], "%Y-%m-%dT%H:%MZ").replace(tzinfo=timezone.utc)
              gap_h = (datetime.now(timezone.utc) - last_ts).total_seconds() / 3600
              if gap_h > SYNTH_THRESHOLD_HOURS:
                  problems.append(
                      f"合成(synthesis)が{gap_h:.0f}h止まってます。最終health.jsonl: {last['ts']} "
                      f"(backlog={last.get('signal_backlog')})。Mac/Windowsどちらもcron/launchdが死んでる可能性。"
                      f"要確認: brain/cron_collect.sh が動くはずのホストの状態、"
                      f"または手元のセッションで git pull してから python3 brain/pipeline.py を叩いて復旧。"
                  )
          except Exception as e:
              problems.append(f"health.jsonl が読めません({e})。要調査。")

          # --- 2. 収集の質(collect_health.json の ok フラグ) ---
          # 2026-08-06: accounts=214/errors=143(67%失敗)でも ok:true だった旧閾値バグをcollect.py側で修正済み。
          # ここでは修正後の ok フラグをそのまま信用してチェックするだけ(二重の網)。
          try:
              ch = json.loads(open("brain/state/collect_health.json").read())
              if not ch.get("ok", True):
                  problems.append(
                      f"X収集が劣化してます(errors={ch.get('errors')}/accounts={ch.get('accounts')}, "
                      f"backend={ch.get('backend')}, ts={ch.get('ts')})。collector/collect.py の要調査。"
                  )
          except Exception:
              pass  # このファイルはcloud-collectが正常なら常にある。無ければ他のチェックに任せる。

          if problems:
              msg = "[trench healthcheck] warning: " + " / ".join(problems)
              emit("stale", "true")
              emit("message", msg)
          else:
              emit("stale", "false")
          PYEOF
        continue-on-error: true

      - name: Notify on staleness
        if: steps.check.outputs.stale == 'true'
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          MSG="${{ steps.check.outputs.message }}"
          echo "::warning::${MSG}"
          if [ -n "$TG_BOT_TOKEN" ] && [ -n "$TG_CHAT_ID" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TG_CHAT_ID}" \
              --data-urlencode "text=${MSG}" >/dev/null || true
          fi
