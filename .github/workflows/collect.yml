name: collect-cloud

# Trench-Brain cloud 冗長収集（憲法 指針2準拠＝門付き watchlist 収集のみ）。
# 役割分担:
#   cloud(ここ)  = 収集の腕。watchlist の新ツイを sources/x へ。Mac が落ちてても止まらない。
#   local(launchd brain/cron_collect.sh) = 観測(track.py)+合成(headless/セッション)+UI export。
# ★ track.py / synthesize.sh はここで回さない（状態は gitignore=local専用 / headless=課金）。
#
# ★2026-07-02 $0化: 収集backendを「梯子(auto)」に変更。無料経路を優先:
#   1) syndication（無認証・ただしGHAのDCIPは429されやすい）
#   2) graphql（無料・要 X_AUTH_TOKEN/X_CT0 secret=捨てアカcookie。DCIPでも通る）
#   無料が全滅すると collect.py が exit 2 → このjobは【赤】になり Telegram 通知が飛ぶ。
#   ＝2026-06-26〜の twitterapi 402 が5日半 green のまま沈黙した false-green を構造的に潰す。
#   有償(twitterapi)へは自動で落ちない（課金は人間の判断）。使うなら workflow_dispatch の
#   use_paid=true で明示。依存は標準ライブラリのみ。

on:
  schedule:
    - cron: "*/15 * * * *"  # 2026-07-30: 3hごと→15分毎に大幅増(本人「高頻度で沢山」)。
      # GitHub Actions公式注意: schedule起動は高負荷時に遅延/間引かれる事があり15分は保証されない(目安)。
  workflow_dispatch:
    inputs:
      use_paid:
        description: "有償 twitterapi.io を使う（$使う・通常はfalse）"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: collect-main          # local push と重なっても直列化
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4          # default branch = main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Collect new tweets (watchlist-gated / hybrid ladder)
        env:
          # graphql 無料経路の cookie（捨てアカ推奨）。主= graphql/syndication。
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0: ${{ secrets.X_CT0 }}
          # queryId が陳腐化した時の差し替え口（未設定ならコード内default）
          X_QID_USER: ${{ secrets.X_QID_USER }}
          X_QID_TWEETS: ${{ secrets.X_QID_TWEETS }}
          # ★ハイブリッド(C): 有料keyを常時渡す＝auto梯子が無料全滅時のみ自動fallback。
          #   定常は無料で$0、無料が死んだ時だけ課金＝実支出最小。残高切れ(402)時も止まらない様
          #   通知は下の failure step で。
          TWITTERAPI_KEY: ${{ secrets.TWITTERAPI_KEY }}
        run: |
          if [ "${{ inputs.use_paid }}" = "true" ]; then
            echo "::warning::有償 twitterapi.io を明示使用（手動指定）"
            python3 collector/collect.py --source twitterapi --throttle 0.3
          else
            # auto = ハイブリッド梯子（syndication→graphql→(無料全滅時)twitterapi）
            python3 collector/collect.py --source auto --throttle 0.3
          fi
        # exit 2（無料も有料も全滅＝真の収集ゼロ）/ exit 3（1/3超が失敗＝劣化）で job 失敗
        #   → 下の notify 発火。
        # ★2026-08-23: 以前は exit 2（全滅）だけが赤だったため、
        #   errors=189/accounts=278（68%失敗）が **1週間 green のまま**続いた。
        #   collect.py 側で「実行中に有料へ切替」と「部分失敗も非ゼロ終了」を入れた。

      - name: Collect news (broad RSS + ワンクッションfilter, $0/認証不要)
        continue-on-error: true  # 実験的追加(2026-07-30)。失敗してもX収集の成否には影響させない。
        run: python3 collector/collect_news.py --limit 30

      - name: Commit & push new sources
        if: success()
        run: |
          git config user.name "trench-brain-cloud"
          git config user.email "actions@users.noreply.github.com"
          git add sources/x sources/news brain/state/collect_health.json brain/state/news_seen.json brain/state/collect_health_news.json
          if git diff --cached --quiet; then
            echo "no new tweets"
          else
            git commit -m "cloud-collect: $(date -u +%Y-%m-%dT%H:%MZ) (GHA)"
            git pull --rebase --autostash origin main || true
            git push
          fi

      - name: Notify on collection failure
        if: failure()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          if [ -n "$TG_BOT_TOKEN" ] && [ -n "$TG_CHAT_ID" ]; then
            MSG="[trench collect-cloud] ⚠️ X収集が失敗（無料経路全滅 or 収集ゼロ）。$(date -u +%Y-%m-%dT%H:%MZ) GHA。graphql cookie(X_AUTH_TOKEN/X_CT0)投入 or 経路確認が必要。"
            curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TG_CHAT_ID}" \
              --data-urlencode "text=${MSG}" >/dev/null || true
          fi
          echo "::error::X collection failed — see logs. Free ladder exhausted."
