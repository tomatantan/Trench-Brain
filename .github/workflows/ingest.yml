name: ingest
# 無料cron。watchlist(X) + News(RSS) + DefiLlama + Reddit を取得し sources/ に自動commit。
# ※このファイルがデフォルトブランチ(main)にmergeされて初めてscheduleが動く。ingestブランチ上では休眠。
on:
  schedule:
    - cron: "0 */3 * * *"   # 3時間ごと（無料枠/レート制限に配慮。必要なら調整）
  workflow_dispatch: {}      # 手動実行も可
permissions:
  contents: write
concurrency:
  group: ingest
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: run ingest
        run: node ingest/run.mjs
      - name: commit new sources
        run: |
          git config user.name "trench-ingest-bot"
          git config user.email "bot@users.noreply.github.com"
          git add sources
          git diff --cached --quiet || git commit -m "ingest: auto $(date -u +%FT%TZ)"
          git push
