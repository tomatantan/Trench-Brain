<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>X archive — Trench-Brain</title>
<!--
  収集済みツイートを読む画面(2026-08-30)。
  sources/x に93,374件あるのに、検索も閲覧もできる場所が無かったので足した。
  索引は brain/x_index.py(SQLite FTS5)。この画面は /api/x/* を叩くだけ。
-->
<style>
  :root{
    --bg:#0b0d10; --panel:#12151a; --line:#1e242c; --fg:#e6e9ee; --dim:#8b95a3;
    --accent:#5eead4; --link:#7dd3fc;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f7f8fa; --panel:#fff; --line:#e3e7ec; --fg:#12151a; --dim:#5c6672;
           --accent:#0d9488; --link:#0369a1; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:15px/1.6 -apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif}
  header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);
         padding:14px 16px;z-index:2}
  h1{margin:0 0 10px;font-size:16px;letter-spacing:.02em}
  h1 small{color:var(--dim);font-weight:400;margin-left:8px}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  input,select{background:var(--panel);color:var(--fg);border:1px solid var(--line);
        border-radius:8px;padding:9px 11px;font:inherit;min-width:0}
  #q{flex:1 1 320px}
  button{background:var(--accent);color:#04211d;border:0;border-radius:8px;
         padding:9px 16px;font:inherit;font-weight:600;cursor:pointer}
  main{padding:12px 16px 60px;max-width:900px;margin:0 auto}
  .tw{border:1px solid var(--line);background:var(--panel);border-radius:10px;
      padding:12px 14px;margin:10px 0}
  .meta{display:flex;gap:10px;flex-wrap:wrap;align-items:baseline;
        color:var(--dim);font-size:12.5px;margin-bottom:6px}
  .meta a{color:var(--link);text-decoration:none}
  .meta b{color:var(--fg);font-weight:600}
  .num{font-variant-numeric:tabular-nums}
  .body{white-space:pre-wrap;word-break:break-word}
  .tick{color:var(--accent);font-size:12px}
  .note{color:var(--dim);font-size:13px;padding:8px 0}
</style>
<header>
  <h1>X archive <small id="stat">読み込み中…</small></h1>
  <div class="row">
    <input id="q" placeholder="全文検索（空でも可 = 新しい順）" autocomplete="off">
    <input id="acc" placeholder="account" size="12">
    <input id="tic" placeholder="ticker" size="8">
    <select id="n"><option>30</option><option>60</option><option>120</option></select>
    <button id="go">検索</button>
  </div>
</header>
<main>
  <div class="note" id="note"></div>
  <div id="out"></div>
</main>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => (s || "").replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function stats() {
  try {
    const r = await fetch("/api/x/stats").then((x) => x.json());
    if (!r.ok) throw new Error(r.error || "failed");
    const s = r.stats;
    $("#stat").textContent =
      `${s.tweets.toLocaleString()}件 / ${s.accounts}アカウント / ${(s.oldest||"").slice(0,10)}〜${(s.newest||"").slice(0,10)}`;
  } catch (e) { $("#stat").textContent = "統計が取れない: " + e.message; }
}

async function run() {
  $("#note").textContent = "検索中…";
  $("#out").innerHTML = "";
  const p = new URLSearchParams({ q: $("#q").value, n: $("#n").value });
  if ($("#acc").value.trim()) p.set("account", $("#acc").value.trim());
  if ($("#tic").value.trim()) p.set("ticker", $("#tic").value.trim());
  try {
    const r = await fetch("/api/x/search?" + p).then((x) => x.json());
    if (!r.ok) throw new Error(r.error || "failed");
    $("#note").textContent = `${r.hits.length}件`;
    $("#out").innerHTML = r.hits.map((h) => `
      <div class="tw">
        <div class="meta">
          <b>@${esc(h.account)}</b>
          <span class="num">${esc((h.created || "").slice(0, 16).replace("T", " "))}</span>
          <span class="num">♥${(h.likes || 0).toLocaleString()} / RT${(h.retweets || 0).toLocaleString()}</span>
          ${h.tickers ? `<span class="tick">${esc(h.tickers)}</span>` : ""}
          <a href="${esc(h.url)}" target="_blank" rel="noopener">原文</a>
        </div>
        <div class="body">${esc(h.body)}</div>
      </div>`).join("");
    if (!r.hits.length) $("#note").textContent = "0件。語を変えるか、account/ticker の絞りを外す。";
  } catch (e) { $("#note").textContent = "失敗: " + e.message; }
}

$("#go").onclick = run;
$("#q").addEventListener("keydown", (e) => { if (e.key === "Enter") run(); });
stats(); run();
</script>
